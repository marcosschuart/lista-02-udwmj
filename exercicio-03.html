    <!-- Exercício 3: Receita Simples -->
    <section id="exercicio-03">
        <h2>Bolo de Caneca</h2>
        <ul>
            <li>4 colheres de farinha de trigo</li>
            <li>4 colheres de açúcar</li>
            <li>1 ovo</li>
        </ul>
        <ol>
            <li>Misture os ingredientes secos na caneca.</li>
            <li>Adicione o ovo e mexa até ficar homogêneo.</li>
            <li>Leve ao micro-ondas por 3 minutos.</li>
        </ol>
    </section>
